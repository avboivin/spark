<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • Viewer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      align-items: center;
      width: 100%;
      height: 100vh;
      background-color: rgb(43, 41, 40);
      margin: 0;
      padding: 0;
    }

    .drop-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .spark-canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      /* Debug aid: always-visible border so an empty/black viewer is distinguishable
         from a viewer that isn't rendering at all (wrong size, not mounted, etc).
         If you see this border with nothing but black inside it, the canvas itself
         is fine and the problem is upstream (no geometry uploaded, camera pointed
         at nothing, etc) -- see console logs prefixed [camera-fit]. */
      border: 6px solid #ff00ff;
    }

    .invisible {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      position: fixed;
      top: 20px;
      left: 30px;
      z-index: 1;
    }

    .logo img {
      width: 40px;
    }

    .hero-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .hero-logo img {
      width: 350px;
      height: auto;
      margin-bottom: 1rem;
    }

    .button,
    .url-input,
    .drop-zone {
      width: 100%;
      max-width: 300px;
      margin: 0.5rem 0;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 1rem;
      text-align: center;
    }

    .drop-zone {
      max-width: 500px;
      padding-top: 4rem;
      padding-bottom: 4rem;
    }

    .button {
      background-color: transparent;
      color: #ccc;
      border: none;
      cursor: pointer;
    }

    .button:hover {
      background-color: rgb(47, 47, 47);
    }

    .button.upload {
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgb(113, 113, 113);
      line-height: 1em;
    }

    .upload-icon {
      margin-right: 10px;
      height: 1em;
    }

    .url-input {
      background-color: rgb(47, 47, 47);
      border: none;
      color: #fff;
    }

    .drop-zone {
      border: 1px dashed #666;
      color: rgb(89, 89, 89);
      background-color: rgb(47, 47, 47);
    }

    .drop-zone.dragover {
      border: 1px dashed #aaa;
      color: rgb(170, 170, 170);
    }

    @media (min-width: 600px) {
      .button,
      .url-input,
      .drop-zone {
        font-size: 1.1rem;
      }
    }

    .hidden {
      display: none;
    }

    .spz-button {
      position: fixed;
      top: 30px;
      right: 30px;
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.5em 1.5em;
      background-color: rgb(60, 60, 60);
      border: 0px solid rgb(60, 60, 60);
      border-radius: 0.5em;
      color: #ff6c6c;
      font-family: system-ui, sans-serif;
      font-size: 0.9em;
      cursor: pointer;
      z-index: 1000;
    }

    .spz-button:hover {
      background-color: rgb(90, 90, 90);
    }

    .spz-button .icon {
      display: flex;
      align-items: center;
    }

    /* — Manual‑marker buttons (user clicks to log timeline events) — */
    .perf-markers {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      font-family: system-ui, sans-serif;
    }
    .perf-markers button {
      padding: 6px 14px;
      border: 1px solid #666;
      border-radius: 4px;
      background: rgba(30,30,30,0.85);
      color: #ccc;
      font-size: 0.8em;
      cursor: pointer;
      white-space: nowrap;
    }
    .perf-markers button:hover { background: rgba(60,60,60,0.85); color: #fff; }
    .perf-markers .btn-good   { border-color: #4a4; color: #8f8; }
    .perf-markers .btn-bad    { border-color: #a44; color: #f88; }

    /* — FPS counter (top‑right corner, always visible after file load) — */
    .fps-counter {
      position: fixed;
      top: 12px;
      right: 20px;
      z-index: 1000;
      font-family: monospace;
      font-size: 14px;
      color: #0f0;
      background: rgba(0,0,0,0.7);
      padding: 4px 10px;
      border-radius: 4px;
      pointer-events: none;
    }
    .fps-counter.low  { color: #f80; }
    .fps-counter.bad  { color: #f44; }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "../js/vendor/three/build/three.module.js",
        "three/addons/": "../js/vendor/three/examples/jsm/",
        "@sparkjsdev/spark": "../../dist/spark.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { SparkRenderer, SplatMesh, SplatPager, transcodeSpz, SparkControls } from "@sparkjsdev/spark";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // — UTC timestamp prefix for every console line so log timestamps can be
    //   correlated with the user's real‑world actions (arrive / wait / done).
    const _consoleTime = () => {
      const d = new Date();
      return d.toISOString().replace('T',' ').replace('Z','') + ' UTC ';
    };
    const _origLog = console.log, _origWarn = console.warn, _origError = console.error;
    console.log   = function(...a) { _origLog.apply(console,   [_consoleTime() + String(a[0] || ''), ...a.slice(1)]); };
    console.warn  = function(...a) { _origWarn.apply(console,  [_consoleTime() + String(a[0] || ''), ...a.slice(1)]); };
    console.error = function(...a) { _origError.apply(console, [_consoleTime() + String(a[0] || ''), ...a.slice(1)]); };

    const sparkCanvasEl = document.querySelector(".spark-canvas");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
    // near/far are widened dynamically in fitCameraToBoundingBox() once the real
    // scene extent is known -- see the comment there for why the fixed far=1000
    // above is only a placeholder before the first fit.
    camera.position.set(0, 0, 1);
    const renderer = new THREE.WebGLRenderer({canvas: sparkCanvasEl});
    const width = sparkCanvasEl.clientWidth;
    const height = sparkCanvasEl.clientHeight;
    var fileName;
    var fileBytes;
    renderer.setSize(width, height, false);
    
    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const controls = new SparkControls({ canvas: sparkCanvasEl });
    // const orbitControls = new OrbitControls(camera, renderer.domElement);
    // orbitControls.target.set(0, 0, 0);
    // orbitControls.minDistance = 0.1;
    // orbitControls.maxDistance = 10;

    // SparkControls' scroll/move/slide speeds are fixed absolute constants
    // (defaults tuned for a scene roughly 1 unit across). Rather than a single
    // flat multiplier -- which is either imperceptibly slow far from the
    // content or wildly overshoots close to it -- rescale every frame by the
    // camera's CURRENT distance to the loaded scene's center, the same way
    // exponential/distance-based dolly works in most 3D viewers (e.g.
    // OrbitControls): big steps while far away, fine steps once close.
    const sceneFocus = new THREE.Vector3();
    let sceneFocusValid = false;
    // Widest extent of the loaded scene (from computeRobustBox), used so the
    // far plane stays big enough to never clip legitimate content regardless
    // of how close the camera currently is.
    let sceneMaxDim = 1;

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      // Only resize if necessary
      const canvas = renderer.domElement;
      const needResize = canvas.width !== width || canvas.height !== height;

      if (needResize) {
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
    }

    window.addEventListener('resize', () => {
      setTimeout(function () { resize(); }, 100);
    });

    let _lastFrameTime = 0;
    let _frameLogThrottle = 0;

    // — FPS counter (exponential moving average) —
    const fpsEl = document.getElementById('fps-counter');
    let _fpsAvg = 0;
    const _fpsAlpha = 0.05; // smoothing factor (lower = smoother)

    renderer.setAnimationLoop(function animate(time) {
      // PERF: log frames that exceed 50ms (typically 16.6ms for 60fps)
      const frameDt = _lastFrameTime ? time - _lastFrameTime : 0;
      _lastFrameTime = time;
      if (frameDt > 50) {
        _frameLogThrottle++;
        if (_frameLogThrottle % 5 === 1) {
          console.warn(`[perf-stall] FRAME = ${frameDt.toFixed(1)}ms (target ~16.6ms), time=${(time/1000).toFixed(1)}s`);
        }
      }
      resize();
      // orbitControls.update();
      if (sceneFocusValid) {
        const dist = Math.max(camera.position.distanceTo(sceneFocus), 1e-3);
        controls.pointerControls.scrollSpeed = 0.0015 * dist;
        controls.pointerControls.slideSpeed = 0.006 * dist;
        controls.fpsMovement.moveSpeed = 1.0 * dist;

        // near/far were only ever set ONCE, at the initial (far-away) camera
        // fit. For a georeferenced scene where the auto-fit framed a wide area
        // (building + surrounding terrain), driving the camera in close to
        // inspect detail meant `near` stayed sized for the original far-away
        // distance -- e.g. fit distance 50000 -> near=50, which is bigger than
        // an entire small building, so approaching it clipped the whole thing
        // away with no warning ("clips-through and disappears"). Recompute
        // near/far from the camera's CURRENT distance every frame instead, so
        // near always shrinks as you approach and far always stays big enough
        // to reach back out to the full scene extent.
        const newNear = Math.max(dist / 1000, 1e-4);
        const newFar = dist + sceneMaxDim * 2 + 1;
        if (Math.abs(camera.near - newNear) > newNear * 0.05 || Math.abs(camera.far - newFar) > newFar * 0.05) {
          camera.near = newNear;
          camera.far = newFar;
          camera.updateProjectionMatrix();
        }
      }
      controls.update(camera);
      // — FPS counter: exponential moving average, updated before render —
      if (frameDt > 0) {
        const instantFps = 1000 / frameDt;
        _fpsAvg = _fpsAvg === 0 ? instantFps : _fpsAvg + _fpsAlpha * (instantFps - _fpsAvg);
        fpsEl.textContent = _fpsAvg.toFixed(0) + ' FPS';
        const cls = _fpsAvg < 15 ? 'bad' : _fpsAvg < 30 ? 'low' : '';
        fpsEl.className = 'fps-counter' + (cls ? ' ' + cls : '');
      }
      // Render-on-demand: only call renderer.render() when the scene changed.
      // When the camera is stationary and all chunks are loaded, the GPU idles.
      // The update logic (driveLod/driveSort) runs via the explicit spark.update()
      // call below, independent of rendering.
      spark.update({ scene, camera });
      if (spark.needsRender()) {
        spark.markRendered();
        renderer.render(scene, camera);
      }
    });

    // Handle drag and drop files.
    const dropZoneEl = document.querySelector('.container');
    const dropUIEl = document.querySelector('.drop-zone');
    const onDragover = function (e) {
      e.preventDefault();
      dropUIEl.classList.add('dragover');
    };
    const onDragLeave = function () {
      dropUIEl.classList.remove('dragover');
    };
    const onDrop = function (e) {
      e.preventDefault();
      dropUIEl.classList.remove('dragover');
      dropUIEl.classList.add('drop');

      const files = e.dataTransfer.files;
      if (files.length > 0) {
        loadSplatFile(files[0]);
      }
    };

    dropZoneEl.addEventListener('dragover', onDragover);
    sparkCanvasEl.addEventListener('dragover', onDragover);

    dropZoneEl.addEventListener('dragleave', onDragLeave);
    sparkCanvasEl.addEventListener('dragleave', onDragLeave);

    dropZoneEl.addEventListener('drop', onDrop);
    sparkCanvasEl.addEventListener('drop', onDrop);

    const fileInput = document.querySelector('#file-input');
    fileInput.onchange = function(event) {
      loadSplatFile(event.target.files[0]);
    };

    // Root cause of the "black screen" bug: `onLoad` fires as soon as the SplatMesh's
    // async setup (manifest parsing, pager wiring) resolves -- NOT once actual chunk
    // geometry has streamed in and uploaded to the GPU. For a paged/chunked mesh those
    // are different moments: geometry pages upload progressively afterward, driven by
    // the render loop. Fitting the camera to `getBoundingBox()` at `onLoad` time reads a
    // legitimately-empty (0,0,0)-sized box, which parks the camera at the origin looking
    // at the origin -- permanently, since nothing ever re-triggers a re-fit once real
    // geometry does arrive a moment later. Fix: poll the bounding box until it's actually
    // non-degenerate (or give up after a timeout and say so loudly), then fit the camera.
    // Photogrammetry scenes contain rare "floater" outlier splats (this dataset
    // reaches +/-175000 while 99.9% of splats sit within +/-5500). Those outliers
    // are clamped into f16 range at pack time so they no longer produce Infinity,
    // but a raw min/max bounding box would still frame the camera around them,
    // shrinking the real content to an invisible speck. Compute a robust box from
    // per-axis percentiles instead, so the camera frames the bulk of the scene and
    // ignores the handful of floaters sitting at the clamp boundary.
    function computeRobustBox(mesh, loPct = 0.5, hiPct = 99.5) {
      const cap = Math.max(1, mesh.numSplats ?? 0);
      const xs = new Float32Array(cap);
      const ys = new Float32Array(cap);
      const zs = new Float32Array(cap);
      let count = 0;
      mesh.forEachSplat((_i, center) => {
        if (count >= cap) return;
        if (Number.isFinite(center.x) && Number.isFinite(center.y) && Number.isFinite(center.z)) {
          xs[count] = center.x; ys[count] = center.y; zs[count] = center.z; count++;
        }
      });
      if (count === 0) return null;
      const pct = (arr, p) => {
        const a = arr.subarray(0, count);
        a.sort();
        const idx = Math.min(count - 1, Math.max(0, Math.round((p / 100) * (count - 1))));
        return a[idx];
      };
      return new THREE.Box3(
        new THREE.Vector3(pct(xs, loPct), pct(ys, loPct), pct(zs, loPct)),
        new THREE.Vector3(pct(xs, hiPct), pct(ys, hiPct), pct(zs, hiPct)),
      );
    }

    // Any FIXED percentile cutoff (even a tight one) is the wrong tool for
    // georeferenced captures like a drone/photogrammetry building scan: the
    // real subject (a building) is a small, DENSE cluster of points, while
    // the rest of the capture (surrounding terrain/context) is a much larger
    // volume of SPARSE points. A percentile window sized to include even 90%
    // of points by COUNT can still span a volume 100x+ larger than the dense
    // subject, because a small fraction of points spread over a huge sparse
    // area drags the percentile bounds out with them -- this is exactly why
    // p5-p95 still framed a real 60x20m building at a ~1km camera distance.
    // Instead, per axis, find the SHORTEST interval containing a majority of
    // points (a standard robust "highest density interval" estimate, via a
    // sliding window over the sorted values) -- this locks onto wherever
    // points are actually concentrated, regardless of how far a sparse tail
    // spreads beyond it.
    function shortestIntervalContaining(sortedArr, count, fraction) {
      const windowCount = Math.max(1, Math.min(count, Math.ceil(fraction * count)));
      let bestWidth = Infinity;
      let bestLo = 0;
      for (let i = 0; i + windowCount - 1 < count; i++) {
        const j = i + windowCount - 1;
        const width = sortedArr[j] - sortedArr[i];
        if (width < bestWidth) { bestWidth = width; bestLo = i; }
      }
      return [sortedArr[bestLo], sortedArr[bestLo + windowCount - 1]];
    }

    function computeDensityBox(mesh, fraction = 0.5) {
      const cap = Math.max(1, mesh.numSplats ?? 0);
      const xs = new Float32Array(cap);
      const ys = new Float32Array(cap);
      const zs = new Float32Array(cap);
      let count = 0;
      mesh.forEachSplat((_i, center) => {
        if (count >= cap) return;
        if (Number.isFinite(center.x) && Number.isFinite(center.y) && Number.isFinite(center.z)) {
          xs[count] = center.x; ys[count] = center.y; zs[count] = center.z; count++;
        }
      });
      if (count === 0) return null;
      const xa = xs.subarray(0, count); xa.sort();
      const ya = ys.subarray(0, count); ya.sort();
      const za = zs.subarray(0, count); za.sort();
      const [x0, x1] = shortestIntervalContaining(xa, count, fraction);
      const [y0, y1] = shortestIntervalContaining(ya, count, fraction);
      const [z0, z1] = shortestIntervalContaining(za, count, fraction);
      return new THREE.Box3(new THREE.Vector3(x0, y0, z0), new THREE.Vector3(x1, y1, z1));
    }

    function fitCameraToBoundingBox(box, label, farBox) {
      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      // farBox (if given) sizes the far plane / control-speed scale separately
      // from the framing box -- see the computeRobustBox call sites below for
      // why these can legitimately differ (a tight box frames the dense
      // "subject" nicely; a wider box still reaches any sparse peripheral
      // content the user scrolls out toward).
      const farSize = new THREE.Vector3();
      (farBox || box).getSize(farSize);
      const farMaxDim = Math.max(farSize.x, farSize.y, farSize.z, maxDim);
      const fov = camera.fov * (Math.PI / 180);
      let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
      cameraZ *= 1.5; // zoom out a bit to fit comfortably
      camera.position.set(center.x, center.y, center.z + cameraZ);
      camera.lookAt(center);
      // The camera's far plane was a fixed placeholder (1000) before any scene
      // was loaded. A scene that needs cameraZ > 1000 to fit in view -- true for
      // most large/wide scenes, not just an edge case -- would then sit entirely
      // beyond the far clipping plane: WebGL discards every fragment past `far`
      // with no error, so the LOD traversal, upload, and camera math can all
      // look completely correct in the console while the canvas stays black.
      // Size near/far around the actual fitted distance with generous margin.
      camera.near = Math.max(cameraZ / 1000, 1e-4);
      camera.far = cameraZ + farMaxDim * 2 + 1;
      camera.updateProjectionMatrix();

      // Remember where the scene is so the render loop can scale control speed
      // by CURRENT distance every frame (see below) -- a flat multiplier tied
      // to the whole scene's maxDim was too coarse: far from the geometry it
      // barely moved the camera, but near the geometry a single wheel notch
      // (~273 units for a ~1824-unit scene) overshot straight past it, so the
      // scene was either a distant speck or already behind the camera with no
      // step size in between.
      sceneFocus.copy(center);
      sceneFocusValid = true;
      sceneMaxDim = Math.max(farMaxDim, 1e-4);

      console.log(
        `[camera-fit] ${label} -- center:`, center, "size:", size,
        "maxDim:", maxDim, "farMaxDim:", farMaxDim, "cameraZ:", cameraZ,
        "near:", camera.near, "far:", camera.far,
      );
      return { center, size, maxDim };
    }

    // PERF: instrument startup -- measure time from drop to first non-empty bbox
    const _startupDropTime = typeof performance !== 'undefined' ? performance.now() : 0;

    // Event-driven camera-fit: resolve when the pager uploads chunk data and
    // the LOD traversal produces non-zero splats. Falls back to polling if
    // the event doesn't fire within a timeout.
    async function onSplatLoad(mesh) {
      const splats = mesh.splats; // PagedSplats
      const pollIntervalMs = 250;
      const maxAttempts = 80; // ~20s total
      const startTime = performance.now();

      // Listen for [lod-tree-update] logs: SparkRenderer.ts's updateLodIndices
      // logs "[lod-tree-update] traverseLodTrees result for mesh UUID: numSplats=N"
      // the first time N becomes non-zero after a chunk upload. We watch for that.
      const originalWarn = console.warn;
      const originalLog = console.log;
      let _cfitDone = false;

      function checkBbox(mesh) {
        if (_cfitDone) return true;
        try {
          const box = mesh.getBoundingBox();
          const size = new THREE.Vector3();
          box.getSize(size);
          const maxDim = Math.max(size.x, size.y, size.z);
          return maxDim > 1e-6;
        } catch (_) { return false; }
      }

      let _cfitResolve = null;
      const _cfitPromise = new Promise((r) => { _cfitResolve = r; });
      const _cfitTimeout = 20000; // 20s fallback

      // Override console.log temporarily to detect the first non-zero traverse
      console.log = function (...args) {
        originalLog.apply(console, args);
        const msg = String(args[0] || '');
        if (msg.includes('[lod-tree-update] traverseLodTrees result') && !_cfitDone) {
          const numSplatsMatch = msg.match(/numSplats=(\d+)/);
          if (numSplatsMatch && parseInt(numSplatsMatch[1]) > 0) {
            if (checkBbox(mesh)) {
              _cfitDone = true;
              _cfitResolve?.();
            }
          }
        }
      };
      console.warn = function (...args) { originalWarn.apply(console, args); };

      let settled = false;
      try {
        await Promise.race([
          _cfitPromise,
          new Promise((r) => setTimeout(r, _cfitTimeout)),
        ]);
      } catch (_) {}

      // Restore console
      console.log = originalLog;
      console.warn = originalWarn;

      if (_cfitDone) {
        finished(1);
        return;
      }

      // Fallback: poll
      console.log(
        "[camera-fit] Event-driven fit didn't resolve yet, falling back to polling. " +
        "Waiting for chunk geometry to stream in...",
      );
      for (let attempt = 1; attempt <= maxAttempts && !_cfitDone; attempt++) {
        try {
          const box = mesh.getBoundingBox();
          const size = new THREE.Vector3();
          box.getSize(size);
          const maxDim = Math.max(size.x, size.y, size.z);
          const numSplats = mesh.numSplats ?? 0;
          const pagesLoaded = splats?.pager?.pageToSplatsChunk?.filter((v) => v !== undefined)?.length ?? 0;
          console.log(
            `[camera-fit] poll ${attempt}/${maxAttempts}: numSplats=${numSplats}, pagesLoaded=${pagesLoaded}, ` +
            `bbox=[${size.x.toFixed(1)}, ${size.y.toFixed(1)}, ${size.z.toFixed(1)}], maxDim=${maxDim.toFixed(1)}`,
          );
          if (maxDim > 1e-6) {
            _cfitDone = true;
            finished(attempt);
            return;
          }
        } catch (e) {
          console.error(`[camera-fit] error reading bounding box on poll ${attempt}:`, e);
        }
        await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
      }

      if (!_cfitDone) {
        const numSplats = mesh.numSplats ?? 0;
        console.warn(
          `[camera-fit] gave up after ${maxAttempts} polls (~${(maxAttempts * pollIntervalMs) / 1000}s) -- ` +
          `bounding box never became non-empty. Current state: numSplats=${numSplats}. ` +
          "If the border around the viewer is visible but the interior stays black, " +
          "check the console for [forEachSplat] / [uploadPage] / [decodeSp5Chunk] messages above " +
          "for Infinity/NaN positions or zero-packed data.",
        );
      }

      async function finished(attempts) {
        const elapsed = (performance.now() - startTime).toFixed(0);
        console.log(
          `[camera-fit] STARTUP METRIC: drop-to-first-bbox = ${elapsed}ms after ${attempts} poll(s), ` +
          `total pages loaded = ${splats?.pager?.pageToSplatsChunk?.filter((v) => v !== undefined)?.length ?? 0}`,
        );
        const box = mesh.getBoundingBox();
        const fitBox = computeDensityBox(mesh, 0.5) || box;
        const wideBox = computeRobustBox(mesh, 0.5, 99.5) || box;
        const first = fitCameraToBoundingBox(fitBox, `settled after ${attempts} poll(s) (density-based 50% bounds)`, wideBox);
        const numSplats = mesh.numSplats ?? 0;
        const pagesLoaded = splats?.pager?.pageToSplatsChunk?.filter((v) => v !== undefined)?.length ?? 0;
        console.log(`[camera-fit] scene now visible with ${numSplats} splats across ${pagesLoaded} pages`);
        await new Promise((resolve) => setTimeout(resolve, 1500));
        const laterBox = computeDensityBox(mesh, 0.5) || mesh.getBoundingBox();
        const laterWideBox = computeRobustBox(mesh, 0.5, 99.5) || mesh.getBoundingBox();
        const laterSize = new THREE.Vector3();
        laterBox.getSize(laterSize);
        if (laterSize.length() > first.size.length() * 1.2) {
          fitCameraToBoundingBox(laterBox, "refit after further chunk growth (robust bounds)", laterWideBox);
        } else {
          console.log("[camera-fit] bounding box stable, keeping initial fit.");
        }
      }
    }

    async function loadSplatFile(splatFile) {
      const maxCacheSplats = parseInt(document.querySelector('#max-cache-splats')?.value || "16777216");
      const backgroundPrefetch = document.querySelector('#background-prefetch')?.checked || false;

      // Task 4: Apply budget knobs — read from dropdowns and set on the
      // SparkRenderer before loading the file. Refresh the page to change.
      const lodSplatCountVal = parseInt(document.querySelector('#lod-splat-count')?.value || "2500000");
      spark.lodSplatCount = lodSplatCountVal > 0 ? lodSplatCountVal : undefined;
      spark.lodRenderScale = parseFloat(document.querySelector('#lod-pixel-threshold')?.value || "1.0");
      console.log(`[budget] lodSplatCount=${spark.lodSplatCount ?? 'default'}, lodRenderScale=${spark.lodRenderScale}`);

      fileName = splatFile.name;
      setSplatFile({
        fileBlob: splatFile,
        fileName,
        paged: true,
        onLoad: onSplatLoad
      });
    }

    var loadedSplat;
    function setSplatFile(init) {
      if (loadedSplat) { scene.remove(loadedSplat); }

      loadedSplat = new SplatMesh(init);
      loadedSplat.quaternion.set(1, 0, 0, 0);
      scene.add(loadedSplat);

      document.querySelector('.container').classList.add('hidden');
      document.querySelector('.canvas-container').classList.remove('invisible');
    }

    let params = new URLSearchParams(document.location.search);
    let splatURL = params.get("url");

    if (splatURL) { loadSplatURL(splatURL); }


    function loadSplatURL(splatURL) {
      fileName = splatURL.split("/").pop().split("?")[0];
      document.querySelector('.container').classList.add('hidden');
      document.querySelector('.canvas-container').classList.remove('invisible');
      setSplatFile({ url: splatURL, onLoad: onSplatLoad });
    }

    const urlFormEl = document.querySelector('.url-form');
    const urlInputEl = document.querySelector('.url-input');
    urlFormEl.addEventListener('submit', function handleEnterKey(event) {
      event.preventDefault();
      const url = new URL(window.location);
      const splatURL = urlInputEl.value;
      loadSplatURL(urlInputEl.value);
      url.searchParams.set('url', splatURL);
      history.pushState(null, '', url);
    });

    // --- manual marker buttons (click handlers write to console) ----------------
    const _markerCounts = { arrive: 0, good: 0, bad: 0 };
    document.getElementById('btn-arrive').addEventListener('click', function () {
      _markerCounts.arrive++;
      console.log(`[user-marker] ARRIVE #${_markerCounts.arrive} — at viewpoint, waiting for LOD ramp`);
    });
    document.getElementById('btn-good').addEventListener('click', function () {
      _markerCounts.good++;
      console.log(`[user-marker] DONE-GOOD #${_markerCounts.good} — LOD ramp finished, scene looks correct`);
    });
    document.getElementById('btn-bad').addEventListener('click', function () {
      _markerCounts.bad++;
      console.log(`[user-marker] DONE-BAD #${_markerCounts.bad} — LOD ramp finished but scene is wrong/clawed-away`);
    });

    document.querySelector('.spz-button').addEventListener('click', async function () {
      const fileInfo =  {
        fileBytes: fileBytes,
        pathOrUrl: fileName,
      };

      const transcodeInfo = {
        inputs: [fileInfo],
        maxSh: 3,
        fractionalBits: 12,
        opacityThreshold: 0
      };
      const transcode = await transcodeSpz(transcodeInfo);
      const blob = new Blob([transcode.fileBytes], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName.split(".")[0] + ".spz";
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
  <div class="canvas-container invisible">
    <div class="logo">
      <a href="/"><img src="spark-logo.svg" alt="Spark Logo" /></a>
    </div>
    <button class="spz-button">
      <span class="icon" aria-hidden="true">
        <img src="download.svg" width="18" height="18" alt="" />
      </span>
      <span class="label">.spz</span>
    </button>
    </button>
    <!--
      Manual marker buttons for correlating user-perceived quality against
      logged timestamps. Click each at the moment described:
        [Arrive] – you've navigated to a viewpoint and are now waiting for
                  the LOD to finish loading at this angle.
        [Good]   – the LOD ramp finished and the scene looks correct/expected.
        [Bad]    – the LOD ramp finished but the scene is clawed‑away,
                  blurry, or otherwise wrong at this viewpoint.
      Each click writes a UTC‑prefixed console.log line so the exact time
      can be compared with the [perf-stall] / [pager-perf] / [pager-evict]
      instrumentation.
    -->
    <div class="perf-markers">
      <button id="btn-arrive">[Arrive] waiting for LOD</button>
      <button class="btn-good" id="btn-good">Done: GOOD</button>
      <button class="btn-bad"  id="btn-bad">Done: BAD</button>
    </div>
    <div class="fps-counter" id="fps-counter">-- FPS</div>
    <canvas class="spark-canvas"></canvas>
  </div>
  <div class="container">
    <div class="drop-container">
      <div class="hero-logo">
        <a href="/"><img src="spark-viewer.svg" alt="Spark Viewer Logo" /></a>
      </div>
      <div class="drop-zone">Drag and drop a splat file here</div>
      <label for="file-input" class="button upload"><img class="upload-icon" src="upload-icon.svg" alt="upload" />Choose file</label>
      <input id="file-input" class="hidden" accept=".ply,.spz,.splat,.ksplat,.zip" type="file" />
      <form class="url-form">
        <input class="url-input" type="text" placeholder="Copy splat URL" />
      </form>
      <div style="margin-top: 20px; font-family: system-ui, sans-serif; font-size: 0.9em; display: flex; flex-direction: column; gap: 8px; color: #ccc; align-items: center;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input id="background-prefetch" type="checkbox" style="cursor: pointer;" />
          Background Prefetch
        </label>
        <label style="display: flex; align-items: center; gap: 8px;">
          Max Cache Splats:
          <input id="max-cache-splats" type="number" value="16777216" style="background: #222; border: 1px solid #444; color: #fff; padding: 4px; border-radius: 4px; width: 120px; font-family: monospace;" />
        </label>
        <!--
          Budget knobs (Task 4): control LOD splat ceiling and pixel threshold
          from the viewer without code edits. Higher threshold = fewer splats =
          lower GPU load ~1/τ². Refresh the page after changing to re-init the
          SparkRenderer with the new values.
        -->
        <label style="display: flex; align-items: center; gap: 8px;">
          Splat Budget:
          <select id="lod-splat-count" style="background: #222; border: 1px solid #444; color: #fff; padding: 4px; border-radius: 4px; font-family: monospace;">
            <option value="500000">500K (mobile)</option>
            <option value="1000000">1M</option>
            <option value="1500000">1.5M</option>
            <option value="2500000" selected>2.5M (desktop)</option>
            <option value="5000000">5M</option>
            <option value="0">unlimited</option>
          </select>
        </label>
        <label style="display: flex; align-items: center; gap: 8px;">
          Pixel Threshold:
          <select id="lod-pixel-threshold" style="background: #222; border: 1px solid #444; color: #fff; padding: 4px; border-radius: 4px; font-family: monospace;">
            <option value="1.0" selected>1.0 px</option>
            <option value="1.5">1.5 px</option>
            <option value="2.0">2.0 px</option>
            <option value="3.0">3.0 px</option>
          </select>
        </label>
      </div>
    </div>
  </div>
</body>
